name: Moderate aviation event

on:
  issues:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: event-moderation
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.action == 'opened' && startsWith(github.event.issue.title, 'Предложение события:')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up labels and mark for review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh label list --repo "$REPOSITORY" --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" --repo "$REPOSITORY" --color "$color" --description "$description"
            fi
          }
          ensure_label "needs-review" "1d76db" "Ожидает ручной проверки источников"
          ensure_label "publish-approved" "0e8a16" "Проверено редактором; передать в публикацию"
          ensure_label "needs-more-information" "fbca04" "Нужны дополнительные подтверждения"
          ensure_label "rejected" "d93f0b" "Отклонено модератором"
          ensure_label "published" "5319e7" "Добавлено в публичную ленту"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label "needs-review"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "Заявка добавлена в очередь проверки. Она не появится на сайте, пока редактор не сверит источники и не применит метку `publish-approved`."

  moderate:
    if: github.event.action == 'labeled' && contains(fromJSON('["publish-approved","rejected","needs-more-information"]'), github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
      members: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply moderator decision
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/moderate-issue.mjs
