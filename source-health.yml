name: Daily source availability check

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check source URL availability
        run: node scripts/check-source-health.mjs
      - name: Publish updated availability report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/source-health.json
          if git diff --cached --quiet; then
            echo "Availability report did not change; skipping commit and site deployment."
            exit 0
          fi
          git commit -m "Update daily source availability report"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          gh workflow run webpack.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH"
      - name: Save metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: reports/source-health.json
          if-no-files-found: warn
          retention-days: 30
